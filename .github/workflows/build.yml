      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: browser-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Build signed release if key is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            trap 'rm -f release.jks' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
            gradle --no-daemon :app:assembleRelease
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: browser-release
          path: app/build/outputs/apk/release/*release.apk
          if-no-files-found: ignore
